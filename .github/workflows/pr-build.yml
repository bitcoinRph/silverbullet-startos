name: PR Package Build

# Build artifacts only: no releases, registry publication, or StartOS installs.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Package (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev curl git jq \
            squashfs-tools squashfs-tools-ng

      - name: Set up QEMU for foreign-architecture image packing
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up OCI-capable Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker run --rm hello-world

      - name: Install official Start CLI
        # Official installation method; only executed on the ephemeral CI runner.
        # https://docs.start9.com/packaging/0.4.0.x/environment-setup.html
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://start9.com/start-cli/install.sh \
            --output "$RUNNER_TEMP/install-start-cli.sh"
          sh "$RUNNER_TEMP/install-start-cli.sh"
          export PATH="$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          start-cli --version

      - name: Initialize isolated packaging workspace
        # A workspace holds package repos, so initialize from the checkout's
        # parent, not inside the package. This also creates a disposable signing
        # key: PR artifacts are NOT signed with a production developer identity.
        run: |
          set -euo pipefail
          cd ..
          start-cli s9pk init-workspace .
          test -f .startos/build.key.pem

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check and build manifest bundle
        # list-ingredients and pack need javascript/index.js to read the manifest.
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run build

      - name: Build architecture package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make "$ARCH"
          test -s "silverbullet_${ARCH}.s9pk"

      - name: Generate and verify SHA256
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sha256sum "silverbullet_${ARCH}.s9pk" > "silverbullet_${ARCH}.s9pk.sha256"
          sha256sum --check "silverbullet_${ARCH}.s9pk.sha256"

      - name: Inspect actual package manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          start-cli s9pk inspect "silverbullet_${ARCH}.s9pk" manifest --format json > "manifest-${ARCH}.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); s=json.dumps(d); assert "2.12.1:3" in s; assert "memory-mcp" in s; assert "silverbullet" in s; assert "index" in s' "manifest-${ARCH}.json"
          git rev-parse HEAD > "source-${ARCH}.txt"

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: silverbullet-${{ matrix.arch }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            silverbullet_${{ matrix.arch }}.s9pk
            silverbullet_${{ matrix.arch }}.s9pk.sha256
            manifest-${{ matrix.arch }}.json
            source-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14
