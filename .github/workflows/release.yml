name: Build and Release

# Builds the .s9pk and publishes a GitHub Release on every merge to main
# (i.e. every merged pull request), and on manual dispatch.
#
# The release tag is derived from the package version in
# startos/versions/current.ts. Bump that version to cut a new release;
# existing tags/releases are immutable: bump the version instead of replacing assets.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'integrations/**']
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev curl git jq \
            squashfs-tools squashfs-tools-ng

      - name: Set up QEMU (for foreign-arch image packing)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up OCI-capable Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker run --rm hello-world

      - name: Install official Start CLI
        # Documented installer; only executed on the ephemeral CI runner.
        # https://docs.start9.com/packaging/0.4.0.x/environment-setup.html
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://start9.com/start-cli/install.sh \
            --output "$RUNNER_TEMP/install-start-cli.sh"
          sh "$RUNNER_TEMP/install-start-cli.sh"
          export PATH="$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          start-cli --version

      - name: Initialize isolated packaging workspace
        # Parent workspace creates an ephemeral key, not a production identity.
        run: |
          set -euo pipefail
          cd ..
          start-cli s9pk init-workspace .
          test -f .startos/build.key.pem

      - name: Determine version and tag
        id: meta
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const source = fs.readFileSync('startos/versions/current.ts', 'utf8');
          const match = source.match(/export\s+const\s+current\s*=\s*VersionInfo\.of\(\{\s*version:\s*(['"])([^'"\r\n]+)\1\s*,/);
          if (!match) throw new Error('Expected current with quoted ExVer version');
          const version = match[2];
          // Preserve full upstream versions, including prerelease suffixes.
          if (!/^(?:#[A-Za-z0-9.-]+:)?\d+(?:\.\d+)*(?:-[A-Za-z0-9.-]+)?:\d+$/.test(version)) {
            throw new Error('Invalid package ExVer');
          }
          console.log(`version=${version}`);
          console.log(`tag=v${version.replaceAll(':', '_')}`);
          NODE

      - name: Refuse existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          for endpoint in "git/ref/tags/$TAG" "releases/tags/$TAG"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint")
            case "$status" in
              404) ;;
              200) echo "Refusing to replace existing $endpoint" >&2; exit 1 ;;
              *) echo "Cannot safely check $endpoint (HTTP $status)" >&2; exit 1 ;;
            esac
          done

      - name: Install npm dependencies
        run: npm ci

      - name: Test, type-check and build the JS bundle
        # start-cli reads the manifest from javascript/index.js, so the bundle
        # must exist before list-ingredients/pack run.
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Memory source and exact-image release gates
        run: |
          set -euo pipefail
          pip install --require-hashes -r memory-mcp/requirements-dev.txt
          ruff check memory-mcp integrations/hermes
          ruff format --check memory-mcp integrations/hermes
          mypy --ignore-missing-imports memory-mcp/src
          PYTHONPATH=memory-mcp/src pytest memory-mcp/tests integrations/hermes/tests -q
          pip-audit --require-hashes -r memory-mcp/requirements.txt
          playwright install --with-deps chromium
          SB_REAL_IMAGE=1 PYTHONPATH=memory-mcp/src pytest memory-mcp/tests/test_real_image.py -v

      - name: Build .s9pk packages (per-arch + universal)
        # x86 -> silverbullet_x86_64.s9pk, arm -> silverbullet_aarch64.s9pk,
        # universal -> silverbullet.s9pk (single file that runs on either arch).
        run: |
          set -euo pipefail
          make x86 arm universal

      - name: Generate and verify SHA256
        run: |
          set -euo pipefail
          for package in silverbullet_x86_64.s9pk silverbullet_aarch64.s9pk silverbullet.s9pk; do
            test -s "$package"
            sha256sum "$package" > "$package.sha256"
            sha256sum --check "$package.sha256"
          done

      - name: Publish new GitHub Release (never replace assets)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Recheck immediately before publication. Inputs go through env, not shell interpolation.
          for endpoint in "git/ref/tags/$TAG" "releases/tags/$TAG"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint")
            case "$status" in
              404) ;;
              200) echo "Refusing to replace existing $endpoint" >&2; exit 1 ;;
              *) echo "Cannot safely check $endpoint (HTTP $status)" >&2; exit 1 ;;
            esac
          done
          # create fails on existing releases; never delete or clobber assets.
          # Pin a newly created tag to this run's commit, not the moving main HEAD.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "SilverBullet $VERSION" --generate-notes \
            silverbullet_x86_64.s9pk silverbullet_x86_64.s9pk.sha256 \
            silverbullet_aarch64.s9pk silverbullet_aarch64.s9pk.sha256 \
            silverbullet.s9pk silverbullet.s9pk.sha256
