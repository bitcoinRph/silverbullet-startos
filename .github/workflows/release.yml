name: Build and Release

# Builds the .s9pk and publishes a GitHub Release on every merge to main
# (i.e. every merged pull request), and on manual dispatch.
#
# The release tag is derived from the package version in
# startos/versions/current.ts. Bump that version to cut a new release;
# merges without a version change refresh the artifact on the existing release.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev \
            squashfs-tools squashfs-tools-ng qemu-user-static jq

      - name: Set up QEMU (for foreign-arch image packing)
        uses: docker/setup-qemu-action@v3

      - name: Install start-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ASSET_NAME="start-cli_${ARCH}-${OS}"
          DOWNLOAD_URL=$(curl -fsS \
            -H "Authorization: token ${GH_TOKEN}" \
            https://api.github.com/repos/Start9Labs/start-os/releases \
            | jq -r '[.[].assets[] | select(.name=="'"$ASSET_NAME"'")] | first | .browser_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: could not find asset '$ASSET_NAME' in Start9Labs/start-os releases" >&2
            exit 1
          fi
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$DOWNLOAD_URL" -o /tmp/start-cli
          sudo install -m 755 /tmp/start-cli /usr/local/bin/start-cli
          rm /tmp/start-cli
          start-cli --version

      - name: Initialize developer signing key
        run: start-cli init-key

      - name: Determine version and tag
        id: meta
        run: |
          ver="$(grep -oE "version: *'[^']+'" startos/versions/current.ts | head -1 | sed -E "s/version: *'//; s/'//")"
          if [ -z "$ver" ]; then echo "Could not read version from current.ts" >&2; exit 1; fi
          tag="v$(echo "$ver" | tr ':' '-')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $ver (tag $tag)"

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check and build the JS bundle
        # start-cli reads the manifest from javascript/index.js, so the bundle
        # must exist before list-ingredients/pack run.
        run: |
          npm run check
          npm run build

      - name: Build universal .s9pk
        run: make universal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SilverBullet ${{ steps.meta.outputs.version }}
          files: silverbullet.s9pk
          fail_on_unmatched_files: true
          generate_release_notes: true
